# Checks every push and pull request: typecheck, unit tests (including the pinned golden battles),
# production build, and the end-to-end campaign runs (desktop and emulated phone) in headless Chromium.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright (for the e2e run only)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:mobile
